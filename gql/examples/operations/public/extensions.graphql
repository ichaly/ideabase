query ResolverAndRemote($lang: String = "zh") {
  users {
    items {
      id
      name
      email
      greeting(lang: $lang)
      sign
      reputation { level title }
    }
  }
}

query CustomRootQuery {
  serverInfo { name version }
}

mutation CustomRootMutation($message: String!) {
  echo(message: $message)
}
