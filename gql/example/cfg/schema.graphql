  upsertAppHistories(input: [AppHistoryCreateInput!]!, on: [String!]): [AppHistory!]!
  # AppHistory更新
  updateAppHistory(input: AppHistoryUpdateInput!, id: ID, where: AppHistoryWhereInput): AppHistory!
  # AppHistory删除
