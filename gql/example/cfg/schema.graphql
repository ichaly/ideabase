type Tag {
  id: ID!
  name: String!
  # 关联的Post列表
  posts(where: PostWhereInput, sort: [PostSortInput!], limit: Int, offset: Int): [Post]!
  # 关联的PostTag列表
  tagPostTags(where: PostTagWhereInput, sort: [PostTagSortInput!], limit: Int, offset: Int): [PostTag]!
}

type User {
  # 关联的Comment列表
  comments(where: CommentWhereInput, sort: [CommentSortInput!], limit: Int, offset: Int): [Comment]!
  createdAt: DateTime!
  email: String!
  id: ID!
  name: String!
  # 关联的Post列表
  posts(where: PostWhereInput, sort: [PostSortInput!], limit: Int, offset: Int): [Post]!
  profile: Json
}

# 游标分页信息
type PageInfo {
  hasNext: Boolean!
  hasPrev: Boolean!
  start: Cursor  # 本页第一条的游标
  end: Cursor  # 本页最后一条的游标
}

