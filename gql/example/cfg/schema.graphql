# 数值聚合结果
type NumberStats {
  sum: Float
  avg: Float
  min: Float
  max: Float
  countDistinct: Int
}

# 字符串聚合结果
type StringStats {
  min: String
  max: String
  countDistinct: Int
}

# 日期聚合结果
type DateTimeStats {
  min: DateTime
  max: DateTime
  countDistinct: Int
}

# 数值聚合having过滤
input NumberHaving {
  sum: FloatWhereInput
  avg: FloatWhereInput
  min: FloatWhereInput
  max: FloatWhereInput
  countDistinct: IntWhereInput
}

# 字符串聚合having过滤
input StringHaving {
  min: StringWhereInput
  max: StringWhereInput
  countDistinct: IntWhereInput
}

# 日期聚合having过滤
input DateTimeHaving {
  min: DateTimeWhereInput
  max: DateTimeWhereInput
  countDistinct: IntWhereInput
}

