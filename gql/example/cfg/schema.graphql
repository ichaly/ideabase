# IdeaBase GraphQL Schema
# 版本: 20260705224113

# 自定义标量类型
scalar Json
scalar Cursor
scalar DateTime

# 排序方向枚举，包含NULL值处理
enum SortDirection {
  ASC
  DESC
  ASC_NULLS_FIRST
  DESC_NULLS_FIRST
  ASC_NULLS_LAST
  DESC_NULLS_LAST
}

# 空值条件枚举
enum IsInput {
  NULL
  NOT_NULL
}

# 百科历史
type AppHistory {
  # 作者
  authorId: Int
  # 变更说明
  changeNote: String
  # 创建时间
  createdAt: DateTime
  # 创建人
  createdBy: Int
  # 逻辑删除
  deletedAt: DateTime
  # 删除人
  deletedBy: Int
  # 最后编辑
  editorId: Int
  # 主键
  id: ID!
  # 词条ID
  lineageId: Int
  # 版本快照
  payload: Json
  # 发布时间
  publishAt: DateTime
  # 备注
  remark: Json
  # 状态
  state: Int
  # 更新时间
  updatedAt: DateTime
  # 更新人
  updatedBy: Int
  # 版本号
  version: Int
  # 权重
  weight: Int
}

# 百科词条
type AppLineage {
  # 别名
  alias: Json
  # 封面
  cover: String
  # 创建时间
  createdAt: DateTime
  # 创建人
  createdBy: Int
  # 逻辑删除
  deletedAt: DateTime
  # 删除人
  deletedBy: Int
  # 难度
  difficulty: Int
  # 草稿内容
  draft: Json
  # 生态环境分类
  environment: Json
  # 图标
  icon: String
  # 主键
  id: ID!
  # 学名标题
  latin: String
  # 内容载体
  payload: Json
  # 父级
  pid: Int
  # 发布时间
  publishAt: DateTime
  # 人类关系分类
  relationship: Json
  # 备注
  remark: Json
  # 状态
  state: Int
  # 中文标题
  title: String
  # 更新时间
  updatedAt: DateTime
  # 更新人
  updatedBy: Int
  # 版本
  version: Int
  # 权重
  weight: Int
}

type Comment {
  # 全部祖先（递归）
  ancestors(where: CommentWhereInput, sort: [CommentSortInput!], limit: Int, offset: Int, depth: Int): [Comment]!
  # 子Comment列表
  children(where: CommentWhereInput, sort: [CommentSortInput!], limit: Int, offset: Int): [Comment]!
  content: String!
  createdAt: DateTime!
  # 全部后代（递归）
  descendants(where: CommentWhereInput, sort: [CommentSortInput!], limit: Int, offset: Int, depth: Int): [Comment]!
  id: ID!
  # 父Comment对象
  parent: Comment
  parentId: ID
  # 关联的Post
  post: Post!
  postId: ID!
  # 关联的User
  user: User!
  userId: ID!
}

# 文件对象记录
type OssFile {
  # 创建时间
  createdAt: DateTime
  # 创建人
  createdBy: Int
  # 逻辑删除
  deletedAt: DateTime
  # 删除人
  deletedBy: Int
  # 原始文件名
  filename: String
  # 文件哈希
  hash: String
  # 存储ID
  hostId: Int
  # 主键
  id: ID!
  # 上传IP
  ip: String
  # 文件类型
  mimeType: String
  # 对象Key
  objectKey: String
  # 备注
  remark: Json
  # 文件大小
  size: Int
  # 状态
  state: Int
  # 更新时间
  updatedAt: DateTime
  # 更新人
  updatedBy: Int
  # 权重
  weight: Int
}

# 对象存储供应商配置
type OssHost {
  # 访问凭证
  accessKey: String
  # 基础路径前缀
  basePath: String
  # 桶名称
  bucket: String
  # 创建时间
  createdAt: DateTime
  # 创建人
  createdBy: Int
  # 逻辑删除
  deletedAt: DateTime
  # 删除人
  deletedBy: Int
  # CDN域名
  domain: String
  # 主键
  id: ID!
  # 存储类型(aliyun/tencent/qiniu/local)
  kind: String
  # 区域
  region: String
  # 备注
  remark: Json
  # 访问密钥
  secretKey: String
  # 状态
  state: Int
  # 存储名称
  title: String
  # 更新时间
  updatedAt: DateTime
  # 更新人
  updatedBy: Int
  # 权重
  weight: Int
}

type Post {
  # 关联的Comment列表
  comments(where: CommentWhereInput, sort: [CommentSortInput!], limit: Int, offset: Int): [Comment]!
  content: String
  createdAt: DateTime!
  id: ID!
  # 关联的PostTag列表
  postPostTags(where: PostTagWhereInput, sort: [PostTagSortInput!], limit: Int, offset: Int): [PostTag]!
  # 关联的Tag列表
  tags(where: TagWhereInput, sort: [TagSortInput!], limit: Int, offset: Int): [Tag]!
  title: String!
  # 关联的User
  user: User!
  userId: ID!
}

type PostTag {
  # 关联的Post
  post: Post!
  postId: ID!
  # 关联的Tag
  tag: Tag!
  tagId: ID!
}

# 资源节点
type SysNode {
  # 是否固定标签
  affix: Boolean
  # 权限编码
  code: String
  # 组件路径
  component: String
  # 创建时间
  createdAt: DateTime
  # 创建人
  createdBy: Int
  # 逻辑删除
  deletedAt: DateTime
  # 删除人
  deletedBy: Int
  # 是否在导航中隐藏
  hidden: Boolean
  # 是否标记为首页
  home: Boolean
  # 图标
  icon: String
  # 主键
  id: ID!
  # 是否保持缓存
  keep: Boolean
  # 外链地址
  link: String
  # 请求方式(API 类型有效)
  method: String
  # 打开方式(iframe/window)
  mode: String
  # 路由名称
  name: String
  # 访问路径
  path: String
  # 父节点
  pid: Int
  # 备注
  remark: Json
  # 状态
  state: Int
  # 显示标题
  title: String
  # 节点类型(DIRECTORY/MENU/BUTTON/API)
  type: String
  # 更新时间
  updatedAt: DateTime
  # 更新人
  updatedBy: Int
  # 权重
  weight: Int
}

