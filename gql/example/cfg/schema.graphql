# 突变根类型
type Mutation {
  # AppHistory创建
  createAppHistory(input: AppHistoryCreateInput!): AppHistory!
  # AppHistory批量创建
  createAppHistories(input: [AppHistoryCreateInput!]!): [AppHistory!]!
